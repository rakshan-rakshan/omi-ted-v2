# OMI-TED v2 — LLM and translation config.
# Provider is a config swap, never a code change. See backend/services/llm_router.py (M5).
llm:
  provider: openrouter    # sarvam | google | openrouter | indictrans2 (config swap, no code change)
  model: anthropic/claude-haiku-4.5   # OpenRouter slug; swap freely (google/gemini-3.5-flash, openai/gpt-4o-mini, ...)
  timeout_s: 60
  cache: true             # skip API call if same te_text already translated

content_type:
  song_max_words: 5       # heuristic: segments with <= N words may be song lyrics

indictrans2:
  model: ai4bharat/indictrans2-indic-en-dist-200M
  batch_size: 8
  max_length: 256
  glossary_postprocess: true
  fallback_provider: openrouter   # used when model not available

rag:
  embedder: intfloat/multilingual-e5-base
  embed_dim: 768
  rrf_k: 60
  top_k_search: 20
  top_k_ask: 5
  chunk_min_words: 80
  chunk_target_words: 250
  chunk_max_words: 500
  chunk_similarity_threshold: 0.85
  generation_model: openrouter/anthropic/claude-3-haiku
  generation_max_tokens: 1024
  hnsw_m: 16
  hnsw_ef_construction: 200
  hnsw_ef_search: 40

# Model routing configuration
models:
  primary_provider: "ollama"
  ollama_base_url: "http://localhost:11434"
  embedding_model: "bge-m3"
  embedding_dim: 768
  query_rewrite_model: "qwen2.5:3b"
  synthesis_model: "qwen2.5:7b-instruct"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranker_max_length: 512
  # LLM-agnostic RAG generation routing. ollama = local/free (slow on CPU, ~77s),
  # openrouter = paid/fast (sub-5s). openrouter_model is the slug used for either step.
  synthesis_provider: "openrouter"   # ollama | openrouter
  rewrite_provider: "openrouter"     # ollama | openrouter
  openrouter_model: "anthropic/claude-haiku-4.5"

# RAG pipeline settings
rag_pipeline:
  enable_query_rewrite: true
  enable_reranking: true
  enable_context_budget: true
  max_context_tokens: 3000
  max_rewritten_terms: 5
